[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v --tb=short -q
log_cli = false

# Silence noisy third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose

markers =
    unit: Pure function tests (no DB, no HTTP)
    integration: Tests that use the test DB or test HTTP client
